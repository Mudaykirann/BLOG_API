spring:
  datasource:
    url: jdbc:postgresql://localhost:5433/BlogV2Testing
    username: postgres
    password: root
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  data:
    redis:
      host: localhost
      port: 6399

logging:
  level:
    org:
      springframework:
        security: DEBUG
        web: DEBUG

