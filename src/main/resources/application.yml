spring:
  application:
    name: BlogV2
  profiles:
    active: dev

imagekit:
  public-key: ${IMAGEKIT_PUBLIC_KEY}
  private-key: ${IMAGEKIT_PRIVATE_KEY}
  url-endpoint: ${IMAGEKIT_URL_ENDPOINT}

app:
  cors:
    allowed-origins: http://localhost:5173,http://localhost:5174,http://localhost:3000
  cookie:
    secure: ${COOKIE_SECURE:false}
