spring:
  application:
    name: BlogV2
  profiles:
    active: dev
  jpa:
    defer-datasource-initialization: true
  sql:
    init:
      mode: always
      continue-on-error: true

imagekit:
  public-key: ${IMAGEKIT_PUBLIC_KEY}
  private-key: ${IMAGEKIT_PRIVATE_KEY}
  url-endpoint: ${IMAGEKIT_URL_ENDPOINT}

app:
  frontend:
    url: ${FRONTEND_BASE_URL:http://localhost:5173}
  cors:
    allowed-origins: http://localhost:5173,http://localhost:5174,http://localhost:3000
  cookie:
    secure: ${COOKIE_SECURE:false}
